<!DOCTYPE html>.
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Mart | Diwali Spin & Win</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  font-family:Arial,sans-serif;color:#fff8e8;
  background:radial-gradient(circle at top,#592020,#180b18 75%);
  display:flex;justify-content:center;align-items:center;
  padding:20px
}
.card{
  width:100%;max-width:440px;text-align:center;
  padding:30px 22px;border:1px solid #d9ae53;
  border-radius:24px;
  background:rgba(32,12,25,.94);
  box-shadow:0 15px 50px #0008
}
.brand{color:#ffd777;font-size:14px;letter-spacing:5px}
h1{color:#ffcf66;font-size:32px;margin:14px 0 8px}
p{line-height:1.6;color:#f5dfc0}
.lamp{font-size:36px;margin:16px}
input{
  width:100%;padding:14px;margin:8px 0;
  border:1px solid #d9ae53;border-radius:10px;
  font-size:16px;background:#fffaf0;color:#251323
}
button{
  width:100%;padding:14px;margin-top:12px;
  border:0;border-radius:10px;
  background:linear-gradient(90deg,#ffca55,#ff8d35);
  color:#34151a;font-size:16px;font-weight:bold;
  cursor:pointer
}
.note{font-size:12px;color:#d8c5b5}
.wheel{
  transition: transform 4s cubic-bezier(0.15, 0.65, 0.15, 1);
  width:220px;height:220px;border-radius:50%;
  margin:24px auto;border:7px solid #ffdb80;
  background:conic-gradient(
    #b51f35 0deg 45deg,#ffce61 45deg 90deg,
    #217a52 90deg 135deg,#6e2ca0 135deg 180deg,
    #b51f35 180deg 225deg,#ffce61 225deg 270deg,
    #217a52 270deg 315deg,#6e2ca0 315deg 360deg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 25px #ffbd4a66
}
.wheel span{
  background:#fff1c9;color:#70212a;border-radius:50%;
  padding:22px;font-weight:bold;border:4px solid #e6aa37
}
#message{min-height:24px;color:#ffda85}
</style>
</head>
<body>
<main class="card">
  <div class="brand">DEV MART</div>
  <div class="lamp">🪔 ✨ 🪔</div>
  <h1>Diwali Spin & Win</h1>
  <p>Celebrate Diwali with Dev Mart!<br>
  Make your shopping extra special.</p>

  <input id="mobile" type="tel" inputmode="numeric"
    maxlength="10" placeholder="Enter your 10-digit mobile number"
    aria-label="Mobile number">

  <input id="billcode" type="text"
    placeholder="Enter your bill eligibility code"
    aria-label="Bill eligibility code">

  <div class="wheel"><span>SPIN<br>& WIN</span></div>

  <button id="spin" type="button">CONTINUE</button>
  <p id="message" role="status"></p>
  <p class="note">
    Eligible bills: ₹1,000 or more. One spin per eligible bill.
    Prize availability and redemption are subject to campaign terms.
  </p>
</main>
<script>
const API_URL = "https://dev-mart-bill-api.devestablishment.workers.dev";

document.getElementById("spin").addEventListener("click", async function () {
  const mobile = document.getElementById("mobile").value.trim();
  const code = document.getElementById("billcode").value.trim();
  const message = document.getElementById("message");
  const button = document.getElementById("spin");
  const wheel = document.querySelector(".wheel");

  if (!/^[6-9]\d{9}$/.test(mobile)) {
    message.textContent = "Please enter a valid 10-digit Indian mobile number.";
    return;
  }

  if (!code) {
    message.textContent = "Please enter your bill eligibility code.";
    return;
  }

  button.disabled = true;
  message.textContent = "Verifying your bill and selecting your prize...";
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";
  void wheel.offsetWidth;
  wheel.style.transition = "transform 4s cubic-bezier(0.15, 0.65, 0.15, 1)";

  try {
    const response = await fetch(API_URL + "/spin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        billCode: code,
        mobile: mobile
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      message.textContent = data.error || "Unable to complete your spin.";
      return;
    }

    wheel.style.transform =
      "rotate(" + (1440 + Math.floor(Math.random() * 360)) + "deg)";

    message.textContent = "Your server-selected prize: " + data.prize;
  } catch (error) {
    message.textContent =
      "Unable to connect. Please try again or ask the cashier for help.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>.
